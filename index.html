<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elham | Appreciate Your Loved Ones</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <!-- Google Font for Calligraphy -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0914;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Glowing Orbs Background */
        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            animation: float 14s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: #ec4899;
            top: 5%;
            left: 10%;
            animation-duration: 12s;
        }

        .orb-2 {
            width: 450px;
            height: 450px;
            background: #8b5cf6;
            bottom: 5%;
            right: 10%;
            animation-duration: 16s;
        }

        .orb-3 {
            width: 280px;
            height: 280px;
            background: #3b82f6;
            top: 40%;
            left: 50%;
            animation-duration: 10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -60px) scale(1.08); }
            100% { transform: translate(-30px, 40px) scale(0.92); }
        }

        /* Floating Emojis Background */
        .emoji-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-emoji {
            position: absolute;
            bottom: -50px;
            font-size: 1.8rem;
            opacity: 0.6;
            animation: floatUp 12s linear infinite;
        }

        .e1 { left: 8%; animation-duration: 14s; animation-delay: 0s; }
        .e2 { left: 22%; animation-duration: 11s; animation-delay: 2s; font-size: 2.2rem; }
        .e3 { left: 38%; animation-duration: 16s; animation-delay: 4s; }
        .e4 { left: 55%; animation-duration: 10s; animation-delay: 1s; font-size: 2.5rem; }
        .e5 { left: 70%; animation-duration: 13s; animation-delay: 3s; }
        .e6 { left: 84%; animation-duration: 15s; animation-delay: 5s; font-size: 2rem; }
        .e7 { left: 93%; animation-duration: 12s; animation-delay: 1.5s; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 2.5rem;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 550px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .elham-logo {
            width: 75px;
            height: 75px;
            margin-bottom: 0.2rem;
            filter: drop-shadow(0px 0px 12px rgba(236, 72, 153, 0.6));
            animation: pulseLogo 3s infinite ease-in-out;
        }

        .brand-title {
            font-size: 2.6rem;
            font-weight: 900;
            background: linear-gradient(to right, #ec4899, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            margin-bottom: 0.1rem;
        }

        p.tagline {
            color: #c084fc;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0;
        }

        @keyframes pulseLogo {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0px 0px 12px rgba(236, 72, 153, 0.6));
            }
            50% {
                transform: scale(1.06);
                filter: drop-shadow(0px 0px 22px rgba(139, 92, 246, 0.85));
            }
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }

        .logout-btn {
            background: none;
            border: none;
            color: #f472b6;
            cursor: pointer;
            font-weight: bold;
            text-decoration: underline;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #f472b6;
            margin-bottom: 0.4rem;
            font-weight: 700;
        }

        input, textarea {
            width: 100%;
            padding: 0.9rem;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #ec4899;
        }

        .emoji-bar {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .emoji-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: transform 0.2s, background 0.2s;
        }

        .emoji-btn:hover {
            transform: scale(1.2);
            background: rgba(236, 72, 153, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.3);
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(236, 72, 153, 0.5);
        }

        .btn-google {
            background: #ffffff;
            color: #333333;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
            margin-top: 0.5rem;
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25D366, #128C7E);
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
        }

        .link-output {
            margin-top: 1.5rem;
            background: rgba(15, 23, 42, 0.8);
            padding: 1.2rem;
            border-radius: 16px;
            border: 1px dashed #ec4899;
            display: none;
        }

        .link-output input {
            margin-bottom: 0.8rem;
            font-size: 0.85rem;
            text-align: center;
        }

        .view-section {
            display: none;
        }

        .active {
            display: block;
        }

        .media-container {
            width: 100%;
            max-height: 250px;
            border-radius: 16px;
            overflow: hidden;
            margin: 1.2rem 0;
            display: none;
        }

        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Updated Note Paper with Cursive Calligraphy */
        .note-paper {
            background: rgba(255, 255, 255, 0.08);
            border-left: 5px solid #ec4899;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: left;
            margin: 1.2rem 0;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .note-paper p {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #fbcfe8;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.3);
        }

        .sender-tag {
            text-align: right;
            color: #c084fc;
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1rem;
        }

        footer span {
            color: #ec4899;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Animated Background Orbs -->
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Floating Emojis Layer -->
    <div class="emoji-bg">
        <span class="floating-emoji e1">❤️</span>
        <span class="floating-emoji e2">✨</span>
        <span class="floating-emoji e3">💖</span>
        <span class="floating-emoji e4">🔥</span>
        <span class="floating-emoji e5">🌸</span>
        <span class="floating-emoji e6">🌹</span>
        <span class="floating-emoji e7">⚡</span>
    </div>

    <div class="card">
        <div class="brand-header">
            <svg class="elham-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ec4899" />
                        <stop offset="50%" stop-color="#8b5cf6" />
                        <stop offset="100%" stop-color="#3b82f6" />
                    </linearGradient>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                <path d="M 50 18 C 30 2, 5 22, 25 47 L 50 77 L 75 47 C 95 22, 70 2, 50 18 Z" fill="none" stroke="url(#logoGrad)" stroke-width="4.5" filter="url(#glow)" />
                <path d="M 42 36 H 58 M 42 46 H 54 M 42 56 H 58" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" />
            </svg>
            <div class="brand-title">Elham</div>
            <p class="tagline">Appreciate your loved ones</p>
        </div>

        <!-- AUTHENTICATION VIEW -->
        <div id="auth-view" class="view-section active">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="authEmail" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="authPassword" placeholder="Enter your password">
            </div>

            <button class="btn" onclick="handleEmailAuth(false)">Log In</button>
            <button class="btn" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);" onclick="handleEmailAuth(true)">Create Account</button>
            
            <div style="margin: 1rem 0; color: #94a3b8; font-size: 0.85rem;">OR</div>
            
            <button class="btn btn-google" onclick="handleGoogleAuth()">Sign In with Google 🚀</button>
        </div>

        <!-- SENDER CREATOR VIEW -->
        <div id="creator-view" class="view-section">
            <div class="user-header">
                <span id="userDisplay">Logged in</span>
                <button class="logout-btn" onclick="handleLogout()">Log Out</button>
            </div>

            <div class="input-group">
                <label>Recipient's Name</label>
                <input type="text" id="toName" placeholder="e.g. Torque / M²">
            </div>

            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="fromName" placeholder="e.g. Wayneo">
            </div>

            <div class="input-group">
                <label>Appreciation Message</label>
                <textarea id="secretMsg" rows="4" placeholder="Express your gratitude..."></textarea>
                
                <div class="emoji-bar">
                    <span class="emoji-btn" onclick="addEmoji('❤️')">❤️</span>
                    <span class="emoji-btn" onclick="addEmoji('✨')">✨</span>
                    <span class="emoji-btn" onclick="addEmoji('🔥')">🔥</span>
                    <span class="emoji-btn" onclick="addEmoji('🙃')">🙃</span>
                    <span class="emoji-btn" onclick="addEmoji('🤝')">🤝</span>
                    <span class="emoji-btn" onclick="addEmoji('⚙️')">⚙️</span>
                    <span class="emoji-btn" onclick="addEmoji('💖')">💖</span>
                    <span class="emoji-btn" onclick="addEmoji('🚀')">🚀</span>
                </div>
            </div>

            <div class="input-group">
                <label>Image URL (Optional)</label>
                <input type="url" id="imageUrl" placeholder="Paste image link (e.g. https://.../photo.jpg)">
            </div>

            <button class="btn" onclick="generateLink()">Create Unique Link ✨</button>

            <div id="linkOutput" class="link-output">
                <p style="font-size: 0.9rem; color: #4ade80; margin-bottom: 0.5rem; font-weight: bold;">Appreciation Link Ready!</p>
                <input type="text" id="generatedUrl" readonly>
                
                <button class="btn" style="margin-top:0; margin-bottom: 10px;" onclick="copyLink()">Copy Link 📋</button>
                <button class="btn btn-whatsapp" style="margin-top:0;" onclick="sendWhatsApp()">Send via WhatsApp 💬</button>
            </div>
        </div>

        <!-- RECIPIENT VIEW -->
        <div id="message-view" class="view-section">
            <h2 id="viewTo" style="color: #f472b6; font-size: 1.8rem;"></h2>
            
            <div id="mediaBox" class="media-container">
                <img id="viewImage" src="" alt="Appreciation Media">
            </div>

            <div class="note-paper">
                <p id="viewMessage"></p>
            </div>

            <div id="viewFrom" class="sender-tag"></div>

            <button class="btn" onclick="window.location.href = window.location.pathname;">Send Appreciation To Someone Else 💌</button>
        </div>

        <footer>
            Crafted by <span>WildCode Developers - Wayneo</span>
        </footer>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDcQZriF_416tQSq57lUKCROOZoYDrUkQY",
            authDomain: "elham-a48c0.firebaseapp.com",
            projectId: "elham-a48c0",
            storageBucket: "elham-a48c0.firebasestorage.app",
            messagingSenderId: "27293956675",
            appId: "1:27293956675:web:6b31976f5cc54a0794b2f6",
            measurementId: "G-F3JTP4DFJ1"
        };

        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1540837210499195051/eUt1-yEaKrYzKHLJzrN1rfpTl8XQAzRqQWYNUP2g1qUgkED1Cu5t7mx8_grX380mc_7T";

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        let currentGeneratedUrl = '';
        let recipientName = '';

        function sendAdminAlert(user, eventType) {
            if (!DISCORD_WEBHOOK_URL) return;

            const payload = {
                username: "Elham Alert Bot 🚀",
                embeds: [{
                    title: `🔔 User ${eventType}`,
                    color: eventType.includes("Signed Up") ? 5763719 : 3447003,
                    fields: [
                        { name: "User Email / Name", value: user.email || user.displayName || "Google User", inline: true },
                        { name: "Date & Time", value: new Date().toLocaleString(), inline: true }
                    ]
                }]
            };

            fetch(DISCORD_WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Alert error:", err));
        }

        // Monitor Login State
        auth.onAuthStateChanged((user) => {
            const urlParams = new URLSearchParams(window.location.search);
            const noteData = urlParams.get('note');

            // If visiting a note link, directly display message view
            if (noteData) {
                showView('message-view');
                renderNote(noteData);
                return;
            }

            if (user) {
                document.getElementById('userDisplay').innerText = user.displayName || user.email;
                if (!document.getElementById('fromName').value) {
                    document.getElementById('fromName').value = user.displayName || user.email.split('@')[0];
                }
                showView('creator-view');
            } else {
                showView('auth-view');
            }
        });

        function showView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        // Email Authentication
        function handleEmailAuth(isSignUp) {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;

            if (!email || !password) {
                alert('Please provide both email and password.');
                return;
            }

            if (isSignUp) {
                auth.createUserWithEmailAndPassword(email, password)
                    .then((cred) => sendAdminAlert(cred.user, "Signed Up (Email)"))
                    .catch(err => alert(err.message));
            } else {
                auth.signInWithEmailAndPassword(email, password)
                    .then((cred) => sendAdminAlert(cred.user, "Logged In (Email)"))
                    .catch(err => alert(err.message));
            }
        }

        // Google Authentication
        function handleGoogleAuth() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((cred) => {
                    const isNew = cred.additionalUserInfo ? cred.additionalUserInfo.isNewUser : false;
                    sendAdminAlert(cred.user, isNew ? "Signed Up (Google)" : "Logged In (Google)");
                })
                .catch(err => alert(err.message));
        }

        // Logout
        function handleLogout() {
            auth.signOut();
        }

        function addEmoji(emoji) {
            const msgInput = document.getElementById('secretMsg');
            msgInput.value += emoji;
            msgInput.focus();
        }

        async function generateLink() {
            const to = document.getElementById('toName').value.trim();
            const from = document.getElementById('fromName').value.trim();
            const msg = document.getElementById('secretMsg').value.trim();
            const img = document.getElementById('imageUrl').value.trim();

            if (!to || !from || !msg) {
                alert('Please fill out your name, recipient name, and message!');
                return;
            }

            recipientName = to;
            const payload = { to, from, msg, img };
            const encodedPayload = btoa(encodeURIComponent(JSON.stringify(payload)));
            
            const longUrl = `${window.location.origin}${window.location.pathname}?note=${encodedPayload}`;

            const outputInput = document.getElementById('generatedUrl');
            document.getElementById('linkOutput').style.display = 'block';
            outputInput.value = "Shortening link...";

            try {
                const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
                if (response.ok) {
                    currentGeneratedUrl = await response.text();
                } else {
                    currentGeneratedUrl = longUrl;
                }
            } catch (e) {
                currentGeneratedUrl = longUrl;
            }

            outputInput.value = currentGeneratedUrl;
        }

        function copyLink() {
            const copyText = document.getElementById('generatedUrl');
            copyText.select();
            document.execCommand('copy');
            alert('Appreciation link copied to clipboard!');
        }

        function sendWhatsApp() {
            const text = `Hey ${recipientName}! I created a special appreciation note for you on Elham ✨\n\nClick here to view it:\n${currentGeneratedUrl}`;
            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
            window.open(whatsappUrl, '_blank');
        }

        function renderNote(data) {
            try {
                const decodedData = JSON.parse(decodeURIComponent(atob(data)));
                
                document.getElementById('viewTo').innerText = `To ${decodedData.to} ✨`;
                document.getElementById('viewMessage').innerText = decodedData.msg;
                document.getElementById('viewFrom').innerText = `With appreciation, — ${decodedData.from}`;

                if (decodedData.img) {
                    const imgBox = document.getElementById('mediaBox');
                    const imgTag = document.getElementById('viewImage');
                    imgTag.src = decodedData.img;
                    imgBox.style.display = 'block';
                }
            } catch(e) {
                console.error("Invalid or corrupted link.");
            }
        }
    </script>
</body>
</html>
